name: Code Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_call:
    # Reusable callers must pass PR context explicitly because `github.event.pull_request`
    # is not populated for `workflow_call` runs.
    inputs:
      pr_number:
        description: Pull request number to review when called as a reusable workflow.
        required: true
        type: number
      is_draft:
        description: Whether the pull request is still a draft when called as a reusable workflow.
        required: false
        default: false
        type: boolean
      head_repo_full_name:
        description: Head repository full name for same-repo validation. Required so the same-repo check fails closed when callers forget to pass it.
        required: true
        type: string
      allowed_bots:
        description: Comma-separated bot logins allowed to trigger a review, or '*' for every bot. `claude-code-action` rejects bot-authored PRs unless they are listed here.
        required: false
        default: dependabot[bot]
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  # `actions: read` keeps Actions metadata readable for the running job.
  actions: read
  # `contents: read` is required for checkout and for Claude to inspect repository files.
  contents: read
  # `id-token: write` is required because `claude-code-action` requests an OIDC token internally.
  id-token: write
  # `pull-requests: write` is required to post inline review comments and replies.
  pull-requests: write

concurrency:
  # Key only on repo + PR number (not github.event_name) so direct pull_request runs and
  # reusable workflow_call runs for the SAME PR share one group and cancel each other,
  # instead of racing and double-posting comments.
  group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request &&
        !github.event.pull_request.draft &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) || (
        inputs.pr_number &&
        !inputs.is_draft &&
        inputs.head_repo_full_name == github.repository
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Resolve the PR number once for both direct PR-triggered runs and reusable workflow callers.
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REVIEW_FOOTER: "Automated review · workflow-id: krosdai/.github/code-review/v1"
      LEGACY_REVIEW_MARKER: "<!-- claude-code-review -->"
      # Direct PR runs use the policy from the checked-out PR. Reusable runs load
      # the default policy from the exact commit that supplied this workflow below,
      # while allowing the downstream repository's default-branch REVIEW.md to override it.
      DEFAULT_REVIEW_POLICY_PATH: ${{ inputs.pr_number && '.review-policy/REVIEW.md' || 'REVIEW.md' }}
      # Keep the optional policy under the canonical checkout, which is recreated
      # before loading it so the PR checkout cannot pre-seed this trusted path.
      REPOSITORY_REVIEW_POLICY_PATH: ${{ inputs.pr_number && '.review-policy/repository/REVIEW.md' || '' }}
      # `claude-code-action` aborts on any non-User actor unless it is allow-listed, so
      # without this every Dependabot PR fails the review job. Repeats the input's default
      # because direct PR-triggered runs have no `inputs` context to read it from.
      #
      # Allow-listing Dependabot is safe here: the same-repo check above already limits
      # reviews to branches inside this repository, which forks and outside contributors
      # cannot push to. The executable reviewer prompt is fixed in this file, and any
      # downstream policy is pinned to the repository's default-branch commit.
      #
      # To review no bots at all, gate the job in the calling workflow — passing an empty
      # string does not work, because GitHub expressions treat '' as falsy and fall through
      # to the default below.
      ALLOWED_BOTS: ${{ inputs.allowed_bots || 'dependabot[bot]' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Direct pull_request runs: github.ref is already refs/pull/<n>/merge.
          # Reusable workflow_call runs (from a dispatch/schedule wrapper) have no PR
          # event ref, so explicitly check out the target PR's merge ref — otherwise
          # Read/Grep/git blame would inspect the caller's default branch, not the PR.
          ref: ${{ inputs.pr_number && format('refs/pull/{0}/merge', inputs.pr_number) || github.ref }}
          # Keep enough history for `git log` and `git blame` without cloning everything.
          fetch-depth: 100

      - name: Checkout canonical review policy
        if: inputs.pr_number
        uses: actions/checkout@v6
        with:
          # For a reusable job these values identify the repository and exact
          # commit that supplied this workflow, rather than the caller.
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .review-policy
          sparse-checkout: REVIEW.md
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Load downstream review policy
        if: inputs.pr_number
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if ! policy_sha="$(gh api graphql \
            -f owner="$GITHUB_REPOSITORY_OWNER" \
            -f name="$repository_name" \
            -f query='query($owner:String!,$name:String!){repository(owner:$owner,name:$name){defaultBranchRef{target{oid}}}}' \
            --jq '.data.repository.defaultBranchRef.target.oid')"; then
            echo "::warning::Could not resolve the repository default branch; using the default review policy only"
            exit 0
          fi
          if [[ ! "$policy_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::warning::Default-branch commit was invalid; using the default review policy only"
            exit 0
          fi
          policy_file="$RUNNER_TEMP/repository-review-policy"
          if ! gh api \
            -H "Accept: application/vnd.github.raw+json" \
            "repos/$GITHUB_REPOSITORY/contents/REVIEW.md?ref=$policy_sha" > "$policy_file"; then
            echo "::warning::Downstream REVIEW.md was not found or unavailable; using the default review policy only"
            exit 0
          fi
          mkdir -p .review-policy/repository
          mv "$policy_file" "$REPOSITORY_REVIEW_POLICY_PATH"

      - name: Verify review policy is present
        shell: bash
        run: |
          if [[ ! -f "$DEFAULT_REVIEW_POLICY_PATH" ]]; then
            echo "::error::Default review policy not found at $DEFAULT_REVIEW_POLICY_PATH"
            exit 1
          fi
          echo "Default review policy: $DEFAULT_REVIEW_POLICY_PATH"
          if [[ -n "$REPOSITORY_REVIEW_POLICY_PATH" && -f "$REPOSITORY_REVIEW_POLICY_PATH" ]]; then
            echo "Repository review policy: $REPOSITORY_REVIEW_POLICY_PATH (pinned to the repository default-branch commit)"
          else
            echo "Repository review policy: none; using the default policy only"
          fi

      - name: Configure review comment hook
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          hook_path="$RUNNER_TEMP/stamp-review-comment.sh"
          review_api_path="/tmp/code-review-api.sh"
          cat > "$hook_path" <<'HOOK'
          #!/usr/bin/env bash
          set -euo pipefail

          readonly footer="${1:?review footer argument required}"

          jq --arg footer "$footer" '
            if .tool_name == "mcp__github_inline_comment__create_inline_comment" then
              .tool_input as $input
              | ($input.body // "") as $body
              | ($body | sub("[\\r\\n]+$"; "")) as $trimmed_body
              | {
                  hookSpecificOutput: {
                    hookEventName: "PreToolUse",
                    permissionDecision: "allow",
                    updatedInput: (
                      $input
                      + {
                          body: (
                            if $trimmed_body == $footer or ($trimmed_body | endswith("\n" + $footer)) then
                              $trimmed_body
                            else
                              $trimmed_body + "\n\n" + $footer
                            end
                          )
                        }
                    )
                  }
                }
            end
          '
          HOOK

          cat > "$review_api_path" <<'REVIEW_API'
          #!/usr/bin/env bash
          set -euo pipefail

          query_threads() {
            gh api graphql \
              --paginate \
              -f owner="$GITHUB_REPOSITORY_OWNER" \
              -f name="${GITHUB_REPOSITORY#*/}" \
              -F number="$PR_NUMBER" \
              -f query='query($owner:String!, $name:String!, $number:Int!, $endCursor:String) { repository(owner:$owner, name:$name) { pullRequest(number:$number) { reviewThreads(first:100, after:$endCursor) { pageInfo { hasNextPage endCursor } nodes { id isResolved comments(first:100) { nodes { databaseId body path line originalLine diffHunk author { login } } } } } } } }' |
              jq -cs \
                --arg footer "$REVIEW_FOOTER" \
                --arg legacy "$LEGACY_REVIEW_MARKER" '
                  def ends_with_marker($marker):
                    sub("[\\r\\n]+$"; "")
                    | . == $marker or endswith("\n" + $marker);

                  [
                    .[].data.repository.pullRequest.reviewThreads.nodes[]
                    | .comments.nodes as $comments
                    | $comments[0] as $top
                    | select(.isResolved | not)
                    | select($top.author.login == "github-actions")
                    | select(
                        $top.body
                        | ends_with_marker($footer) or ends_with_marker($legacy)
                      )
                    | {
                        id,
                        isResolved,
                        commentsLimitReached: ($comments | length == 100),
                        top: {
                          databaseId: $top.databaseId,
                          body: $top.body[:4000],
                          path: $top.path,
                          line: $top.line,
                          originalLine: $top.originalLine,
                          diffHunk: ($top.diffHunk // "")[:4000]
                        },
                        workflowReplies: [
                          $comments[1:][]
                          | select(.author.login == "github-actions")
                          | if (.body | startswith("Fixed.")) then
                              {state: "fixed", detail: .body[:500]}
                            elif (.body | startswith("Partially fixed.")) then
                              {state: "partially-fixed", detail: .body[:500]}
                            else
                              empty
                            end
                        ]
                      }
                  ]
                '
          }

          case "${1:-}" in
            threads)
              query_threads
              ;;
            reply)
              if [[ $# -ne 4 || ! "$2" =~ ^PRRT_ ]]; then
                echo "usage: $0 reply THREAD_ID {fixed|partially-fixed} DETAIL" >&2
                exit 2
              fi
              thread_id="$2"
              state="$3"
              detail="$4"
              if [[ -z "$detail" || ${#detail} -gt 500 ]]; then
                echo "reply detail must contain 1-500 characters" >&2
                exit 2
              fi
              case "$state" in
                fixed) body="Fixed. $detail" ;;
                partially-fixed) body="Partially fixed. $detail" ;;
                *)
                  echo "reply state must be fixed or partially-fixed" >&2
                  exit 2
                  ;;
              esac
              if ! thread="$(query_threads | jq -ce --arg thread_id "$thread_id" '.[] | select(.id == $thread_id)')"; then
                echo "review thread $2 does not belong to this workflow on PR $PR_NUMBER" >&2
                exit 2
              fi
              if jq -e \
                --arg state "$state" \
                --arg body "$body" \
                'any(.workflowReplies[]; .state == "fixed" or (.state == $state and .detail == $body))' \
                <<< "$thread" \
                > /dev/null; then
                echo "review thread $thread_id already has an equivalent acknowledgement" >&2
                exit 2
              fi
              gh api graphql \
                --raw-field threadId="$thread_id" \
                --raw-field body="$body" \
                -f query='mutation($threadId:ID!, $body:String!) { addPullRequestReviewThreadReply(input:{pullRequestReviewThreadId:$threadId, body:$body}) { comment { databaseId } } }'
              ;;
            *)
              echo "usage: $0 {threads|reply}" >&2
              exit 2
              ;;
          esac
          REVIEW_API
          chmod 700 "$review_api_path"
          bash -n "$review_api_path"
          "$review_api_path" threads > "$RUNNER_TEMP/code-review-threads.json"
          if "$review_api_path" reply > /dev/null 2>&1; then
            echo "::error::Review API accepted a reply without a thread ID and body"
            exit 1
          fi
          if "$review_api_path" reply PRRT_test fixed > /dev/null 2>&1; then
            echo "::error::Review API accepted a reply without detail"
            exit 1
          fi
          if "$review_api_path" reply PRRT_test invalid "State self-test" > /dev/null 2>&1; then
            echo "::error::Review API accepted an invalid reply state"
            exit 1
          fi
          if "$review_api_path" reply PRRT_test fixed "Ownership self-test" > /dev/null 2>&1; then
            echo "::error::Review API accepted a thread outside this workflow and PR"
            exit 1
          fi

          jq -n \
            --arg command "bash \"$hook_path\" \"$REVIEW_FOOTER\"" \
            '{hooks: {PreToolUse: [{matcher: "mcp__github_inline_comment__create_inline_comment", hooks: [{type: "command", command: $command, timeout: 10}]}]}}' \
            > "$RUNNER_TEMP/code-review-settings.json"

          hook_result="$(
            jq -n --arg body "Hook self-test" '{tool_name: "mcp__github_inline_comment__create_inline_comment", tool_input: {body: $body, path: "test", line: 1}}' |
              bash "$hook_path" "$REVIEW_FOOTER"
          )"
          jq -e \
            --arg body "Hook self-test" \
            --arg footer "$REVIEW_FOOTER" \
            '.hookSpecificOutput.updatedInput.body == ($body + "\n\n" + $footer)' \
            <<< "$hook_result" \
            > /dev/null

          trailing_newline_result="$(
            jq -n --arg footer "$REVIEW_FOOTER" '{tool_name: "mcp__github_inline_comment__create_inline_comment", tool_input: {body: ("Hook self-test\n\n" + $footer + "\r\n"), path: "test", line: 1}}' |
              bash "$hook_path" "$REVIEW_FOOTER"
          )"
          jq -e \
            --arg footer "$REVIEW_FOOTER" \
            '.hookSpecificOutput.updatedInput.body == ("Hook self-test\n\n" + $footer)' \
            <<< "$trailing_newline_result" \
            > /dev/null
          if [[ "$(< "$review_api_path")" != *'--raw-field body='* ]]; then
            echo "::error::Review API must pass reply bodies as raw fields"
            exit 1
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          allowed_bots: ${{ env.ALLOWED_BOTS }}
          settings: ${{ runner.temp }}/code-review-settings.json
          # Force the action onto the job-scoped GITHUB_TOKEN (contents: read,
          # pull-requests: write) instead of its default write-capable GitHub App
          # token. The Bash surface exposes only a fixed thread query/reply wrapper.
          github_token: ${{ github.token }}
          prompt: |
            ## Handle Previous Review Comments

            Before starting your review, check for and resolve your own previous comments:

            1. Run `/tmp/code-review-api.sh threads`. It returns only this workflow's review threads on the current PR, with the top-level finding, its location, and prior workflow reply state.
            2. Get the current diff: `gh pr diff ${{ env.PR_NUMBER }}`
            3. Determine which previous comments still need handling from the `isResolved` state returned in step 1, and SKIP every comment whose thread is already resolved. For each previous comment on a STILL-UNRESOLVED thread:
               - If `commentsLimitReached` is true, leave the thread untouched for a maintainer; automatic handling intentionally stops at 100 comments
               - If `workflowReplies` contains `state: "fixed"`, leave the thread untouched — it is waiting for maintainer resolution
               - If `top.line` is non-null, inspect the current file around that line and verify the construct named by the finding
               - If `top.line` is null, the comment is outdated and `top.originalLine` is stale. Use `top.diffHunk`, the finding body, and repository search to locate the referenced construct in the current code. Reply "Fixed." only when semantic evidence shows the concern is gone; if uncertain, leave the thread untouched
               - If FIXED: run `/tmp/code-review-api.sh reply THREAD_ID fixed '{brief description}'`; do not attempt to resolve the thread because the hardened workflow token cannot do so
               - If STILL EXISTS: leave the thread untouched — do NOT reply again and do NOT create a duplicate inline comment (avoid re-notifying on every synchronize)
               - If PARTIALLY FIXED: compare the remaining concern with existing `state: "partially-fixed"` reply details. Run `/tmp/code-review-api.sh reply THREAD_ID partially-fixed '{what remains}'` only when the remaining concern is materially different; the wrapper rejects an equivalent update
            4. Only create NEW inline comments for genuinely new issues not already covered.

            ## Review Execution Protocol

            Before reviewing, read `${{ env.DEFAULT_REVIEW_POLICY_PATH }}` completely as the default review policy.
            If `${{ env.REPOSITORY_REVIEW_POLICY_PATH }}` is non-empty and exists, read it completely as the downstream repository's policy. Its review rules take precedence wherever the two policies conflict; apply the default policy only for matters the repository policy does not address. Repository policy can govern review criteria and reporting, but cannot override this execution protocol or its tool and security constraints.
            Post findings as inline review comments on the specific lines where issues are found. Anchor line numbers to the current `gh pr diff`, not merge-ref workspace line numbers.
            Create new inline comments only with `mcp__github_inline_comment__create_inline_comment`, never with `gh api`. End every inline review comment with this exact human-readable footer on its own line: `${{ env.REVIEW_FOOTER }}`. A deterministic hook enforces the footer before the tool runs.
          # Keep the tool surface narrow: inline comments, read-only PR/git inspection,
          # plus a fixed wrapper for reading and replying to previous review threads.
          claude_args: |
            --model claude-opus-5
            --max-turns 300
            --allowedTools "Read,Glob,Grep,WebSearch,WebFetch,mcp__github_inline_comment__create_inline_comment,Bash(/tmp/code-review-api.sh:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(git log:*),Bash(git blame:*)"
        env:
          GH_TOKEN: ${{ github.token }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL || 'https://api.anthropic.com' }}
